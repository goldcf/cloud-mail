name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "705a84f2-3fb5-4cf8-af75-e5bd89db818e"

[[kv_namespaces]]
binding = "kv"
id = "bb283414c57a41ddb21ac28568964678"
#[[r2_buckets]]
#binding = "r2"
#bucket_name = "cloud-mail"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/oss/*", "/static/*", "/attachments/*", "/proxy", "/realtime" ]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]

[vars]
domain = ["410425.xyz"]
# admin / password / jwt_secret 不写进仓库，改由 GitHub Secrets 在 CI 中用
# `wrangler secret put` 注入（见 .github/workflows/deploy.yml）

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"

# 触发测试：验证 push -> Actions 自动部署链路
